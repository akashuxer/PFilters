<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>o9con &mdash; Icon Library Cheatsheet</title>
  <meta name="description" content="Browse, search, and copy class names for the o9con icon font." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <!-- The icon font itself (regenerated by o9con:update). -->
  <link rel="stylesheet" href="../css/o9con.css" />
  <!-- Cheatsheet UI. -->
  <link rel="stylesheet" href="./cheatsheet.css" />
</head>
<body>
  <header class="header">
    <h1>o9con Icon Library</h1>
    <p class="header__sub">
      <span id="iconCount">&hellip;</span> icons &middot; v<span id="version">&hellip;</span>
    </p>

    <div class="controls">
      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search icons (name)"
        autocomplete="off"
        spellcheck="false"
      />
      <label class="toggle">
        <input id="toggleAliases" type="checkbox" />
        Show aliases
      </label>
    </div>
    <p class="hint">Click any tile to copy the class name to your clipboard.</p>
  </header>

  <main id="main" class="main">
    <p class="loading">Loading icons&hellip;</p>
  </main>

  <footer class="footer">
    <p>
      o9con icon font &middot; published as <code>@arvo/assets</code> &middot;
      regenerate via <code>pnpm --filter @arvo/assets run o9con:update</code>
    </p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Generated payload: window.O9CON_DATA = { version, icons, groups, aliases }. -->
  <script src="./data.js"></script>
  <script src="./cheatsheet.js" defer></script>
</body>
</html>
